# Every value in this file is an illustrative placeholder, not a real operator figure.
# Currency is KES (illustrative). These are not market rates, wage-survey results, or measured volumes.
# Bitext example counts are not in this file on purpose. Demand weights below are a separate assumption.
# Edit a value, then run: python -m care_roi

currency_code: KES
currency_label: "KES (illustrative)"
note: "Every number in this file is an illustrative placeholder, not a real operator figure."

volume:
  annual_contacts: 120000

wages:
  voice_agent_monthly_wage: 80000
  chat_agent_monthly_wage: 70000
  senior_agent_monthly_wage: 120000
  burden_rate: 0.30
  monthly_productive_hours: 140

handle_time_minutes:
  voice_agent: 8
  senior_agent: 10
  live_chat: 12
  ivr: 3

channel_variable:
  voice_telco_per_minute: 1.50
  ivr_per_minute: 0.80
  ivr_platform_per_contact: 2.00
  ussd_per_session: 1.00
  ussd_sessions_per_contact: 1.20
  live_chat_platform_per_contact: 3.00
  chat_bot_platform_per_contact: 3.00

# Share of contacts of that automation class offered to each channel. Each class sums to 1.
# voice_agent means the contact is served by a voice agent with no automation attempt.
routing_share:
  lookup:
    ussd_bot: 0.80
    chat_bot: 0.10
    ivr: 0.05
    voice_agent: 0.05
  structured_transaction:
    ussd_bot: 0.30
    chat_bot: 0.20
    ivr: 0.10
    voice_agent: 0.40
  human_required:
    ussd_bot: 0.00
    chat_bot: 0.00
    ivr: 0.10
    voice_agent: 0.90

# Probability the contact is finished on that channel. The rest also pay a voice-agent contact.
containment_rate:
  lookup:
    ussd_bot: 0.70
    chat_bot: 0.65
    ivr: 0.50
  structured_transaction:
    ussd_bot: 0.40
    chat_bot: 0.45
    ivr: 0.20
  human_required:
    ussd_bot: 0.00
    chat_bot: 0.00
    ivr: 0.00

containment_scenario_delta: 0.20

# Assumed annual demand weights. They are not the Bitext count of 1000 examples per intent.
demand_weight_by_intent:
  check_usage: 140
  invoices: 90
  check_mobile_payments: 50
  payment_methods: 30
  check_excess_data_charges: 40
  check_signal_coverage: 35
  check_cancellation_fee: 15
  pay: 100
  schedule_payments: 25
  set_usage_limits: 20
  change_plan: 45
  sign_up_for_plan: 30
  activate_roaming: 20
  activate_call_management_services: 15
  deactivate_call_management_services: 10
  report_problem: 80
  report_poor_signal_coverage: 40
  dispute_invoice: 35
  get_compensation: 20
  human_agent: 45
  customer_service: 30
  cancel_plan: 25
  change_provider: 15
  activate_phone: 15
  deactivate_phone: 10
  install_internet: 20

# MULTI-HEAD documents urgency labels low, medium, and emergency, and it documents no accuracy metric.
# Precision and recall here are assumptions. They are not a measured score from that model.
triage:
  prevalence: 0.08
  recall: 0.75
  precision: 0.40
  value_per_true_positive: 250
  penalty_per_false_negative: 250

investment:
  bot_build_cost: 2500000
  bot_annual_licence: 600000
  triage_build_cost: 400000
  triage_annual_licence: 180000

sensitivity_relative_swing: 0.20
